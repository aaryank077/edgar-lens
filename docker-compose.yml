services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: edgarlens
      POSTGRES_USER: edgarlens
      POSTGRES_PASSWORD: edgarlens
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgarlens"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/edgarlens
      DATABASE_USER: edgarlens
      DATABASE_PASSWORD: edgarlens
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT to "YourName your-email@example.com"}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
